version: '3'

vars:
  NS_FULL: 'tls-demo-full'
  NS_STRIPPED: 'tls-demo-stripped'
  SPO_NS: 'security-profiles-operator'
  PROFILE_OUT_DIR: './seccomp-profiles'

  # Pinned 2026-09-24 against the actual latest releases at the time:
  #   https://github.com/kubernetes-sigs/security-profiles-operator/releases
  #   https://github.com/cert-manager/cert-manager/releases
  # Re-check both before bumping — SPO's CRDs graduated from v1alpha1 to
  # v1 between older docs and this version, so don't assume old examples
  # found online still match; verify with `kubectl explain` against
  # whatever version you land on.
  SPO_VERSION: 'v1.1.0'
  CERT_MANAGER_VERSION: 'v1.21.2'

tasks:
  install-operator:
    desc: 'Install cert-manager + Security Profiles Operator ({{.SPO_VERSION}})'
    cmds:
      - kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/{{.CERT_MANAGER_VERSION}}/cert-manager.yaml
      - kubectl wait --for=condition=Available deploy --all -n cert-manager --timeout=300s
      - kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/security-profiles-operator/{{.SPO_VERSION}}/deploy/operator.yaml
      - kubectl wait --for=condition=Available deploy --all -n {{.SPO_NS}} --timeout=300s
      - |
        # The spod daemon (the actual per-node recorder) is a custom resource
        # that SPO's controller creates asynchronously after it starts, so it
        # may not exist yet the instant the controller Deployment becomes
        # Available. Poll for it to show up before touching it.
        echo "Waiting for the spod daemon to be created..."
        for i in $(seq 1 60); do
          kubectl get spod spod -n {{.SPO_NS}} >/dev/null 2>&1 && break
          sleep 5
        done
      - |
        # enricher.enableBpfRecorder defaults to false on operator.yaml's own
        # spod CR — recorder: Bpf in a ProfileRecording silently does nothing
        # without this (the controller still annotates pods, but spod never
        # runs a recorder, so the ProfileRecording's lock finalizer waits
        # forever for a session that never starts). Confirmed against a live
        # v1.1.0 install: `kubectl get spod spod -o yaml` showed
        # enricher.enableBpfRecorder: false and the daemon container's own
        # args included `--with-recording=false` until this was set.
        kubectl patch spod spod -n {{.SPO_NS}} --type=merge -p '{"spec":{"enricher":{"enableBpfRecorder":true}}}'
      - |
        # Patching spod's spec above rolls its DaemonSet pods again, so wait
        # for Ready AFTER the patch, not before — otherwise this can pass
        # against the pre-patch (recording-disabled) generation.
        kubectl wait --for=condition=Ready spod/spod -n {{.SPO_NS}} --timeout=300s

  enable-recording:
    desc: 'Label both tls-demo namespaces so SPO records pods started in them'
    cmds:
      - kubectl label ns {{.NS_FULL}} spo.x-k8s.io/enable-recording=true --overwrite
      - kubectl label ns {{.NS_STRIPPED}} spo.x-k8s.io/enable-recording=true --overwrite

  start-recording:
    desc: 'Apply ProfileRecordings for both namespaces and restart workloads so SPO attaches recorders'
    cmds:
      - kubectl apply -f ./seccomp/recordings/recording-full.yaml
      - kubectl apply -f ./seccomp/recordings/recording-stripped.yaml
      # Mandatory: SPO only attaches its recorder to pods that start AFTER
      # the ProfileRecording exists — without this restart, recording
      # silently captures nothing from the pods already running.
      - kubectl rollout restart deploy/service-a deploy/service-b -n {{.NS_FULL}}
      - kubectl rollout restart deploy/service-a deploy/service-b -n {{.NS_STRIPPED}}
      - |
        echo ""
        echo "=========================================================================="
        echo "Recording is active for service-a/service-b in both namespaces."
        echo "Let the workloads run long enough to exercise EVERY code path — normal"
        echo "traffic, error paths, startup, and any periodic/background work — before"
        echo "running 'task seccomp:stop-recording'. A profile only contains syscalls"
        echo "actually observed during recording; anything that didn't run will be"
        echo "missing and can get blocked later if the profile is enforced."
        echo "=========================================================================="

  scale-down:
    desc: 'Scale service-a/service-b to 0 in both namespaces'
    cmds:
      # ProfileRecording's finalizer is NOT released by deleting the object.
      # A separate RecordingTrackerReconciler watches Pods and adds every pod
      # matching the recording's podSelector to .status.activeWorkloads
      # (regardless of whether the recording is already being deleted); the
      # finalizer only clears once that list is empty, i.e. once every pod it
      # ever tracked has actually been deleted. service-a/service-b are
      # long-running Deployments that never exit on their own, so with the
      # pods just sitting there the finalizer would never clear — confirmed
      # by reading internal/pkg/manager/recordingtracker/recordingtracker.go
      # in the v1.1.0 source. `kubectl rollout restart` does NOT work around
      # this either: Kubernetes' default RollingUpdate creates the new pod
      # before deleting the old one, so a still-existing ProfileRecording
      # immediately re-tracks the new pod. Scaling to 0 deletes the tracked
      # pod with no replacement to re-track it. Also useful standalone, for
      # manually recovering a stuck recording — see seccomp/README.md.
      - kubectl scale deploy/service-a deploy/service-b -n {{.NS_FULL}} --replicas=0
      - kubectl scale deploy/service-a deploy/service-b -n {{.NS_STRIPPED}} --replicas=0

  scale-up:
    desc: 'Scale service-a/service-b back to 1 in both namespaces (the chart uses a fixed replica count of 1)'
    cmds:
      - kubectl scale deploy/service-a deploy/service-b -n {{.NS_FULL}} --replicas=1
      - kubectl scale deploy/service-a deploy/service-b -n {{.NS_STRIPPED}} --replicas=1

  stop-recording:
    desc: 'Finalize recording — this triggers SPO to emit the SeccompProfile CRDs'
    cmds:
      - kubectl delete profilerecording --all -n {{.NS_FULL}} --ignore-not-found --wait=false
      - kubectl delete profilerecording --all -n {{.NS_STRIPPED}} --ignore-not-found --wait=false
      - echo "Scaling service-a/service-b to 0 to release the recorder's tracked pods..."
      - task: scale-down
      - kubectl wait --for=delete profilerecording --all -n {{.NS_FULL}} --timeout=180s
      - kubectl wait --for=delete profilerecording --all -n {{.NS_STRIPPED}} --timeout=180s
      - task: scale-up

  list:
    desc: 'Show generated SeccompProfiles in both namespaces'
    cmds:
      # SeccompProfile is cluster-scoped (confirmed: `kubectl api-resources`
      # shows NAMESPACED=false), so `-n` is silently ignored by kubectl —
      # filter on the spo.x-k8s.io/recording-namespace label it's created
      # with instead.
      - echo "--- {{.NS_FULL}} ---"
      - 'kubectl get seccompprofile -l spo.x-k8s.io/recording-namespace={{.NS_FULL}} -o custom-columns="NAME:.metadata.name,STATUS:.status.status,LOCALHOSTPROFILE:.status.localhostProfile"'
      - echo "--- {{.NS_STRIPPED}} ---"
      - 'kubectl get seccompprofile -l spo.x-k8s.io/recording-namespace={{.NS_STRIPPED}} -o custom-columns="NAME:.metadata.name,STATUS:.status.status,LOCALHOSTPROFILE:.status.localhostProfile"'

  dump:
    desc: 'Write every generated SeccompProfile as a full, re-applyable YAML manifest to {{.PROFILE_OUT_DIR}}/<namespace>/<recording-id>.yaml'
    # Long syscall lists are far easier to read and diff as files than
    # printed to the terminal one at a time — this replaces the old `show`
    # task. Requires yq (mikefarah/yq) to strip server-side noise from the
    # full `kubectl get -o yaml` output; fail loudly up front rather than
    # silently writing unfiltered YAML if it's missing.
    preconditions:
      - sh: 'command -v yq >/dev/null 2>&1'
        msg: 'yq is required for seccomp:dump (strips managedFields/resourceVersion/uid/generation/creationTimestamp/status before writing) — install it first, e.g. from https://github.com/mikefarah/yq'
    cmds:
      - |
        set -e
        total=0
        for ns in {{.NS_FULL}} {{.NS_STRIPPED}}; do
          names=$(kubectl get seccompprofile -l spo.x-k8s.io/recording-namespace="$ns" -o jsonpath='{.items[*].metadata.name}')
          if [ -z "$names" ]; then
            echo "No SeccompProfiles found for $ns yet — run 'task seccomp:start-recording' then 'task seccomp:stop-recording' first."
            continue
          fi
          mkdir -p "{{.PROFILE_OUT_DIR}}/$ns"
          for name in $names; do
            # File name is the recording-id label (e.g. "service-a"), not the
            # object's own metadata.name (which carries a random per-pod
            # suffix) — matches the basename `export` already writes its
            # .json alongside, so the pair sits together in the same dir.
            recording_id=$(kubectl get seccompprofile "$name" -o jsonpath='{.metadata.labels.spo\.x-k8s\.io/recording-id}')
            out="{{.PROFILE_OUT_DIR}}/$ns/${recording_id:-$name}.yaml"
            kubectl get seccompprofile "$name" -o yaml \
              | yq 'del(.metadata.managedFields, .metadata.resourceVersion, .metadata.uid, .metadata.generation, .metadata.creationTimestamp, .status)' \
              > "$out"
            echo "wrote $out"
            total=$((total + 1))
          done
        done
        echo "Dumped $total profile(s)."

  show-all:
    desc: 'Print full JSON for all 4 profiles (service-a/service-b x full/stripped) at once, no args needed'
    cmds:
      - |
        for ns in {{.NS_FULL}} {{.NS_STRIPPED}}; do
          for svc in service-a service-b; do
            echo ""
            echo "=== $svc ($ns) ==="
            spec=$(kubectl get seccompprofile -l spo.x-k8s.io/recording-id=$svc,spo.x-k8s.io/recording-namespace=$ns -o jsonpath='{.items[0].spec}')
            if [ -z "$spec" ]; then
              echo "  (no profile found — run 'task seccomp:list' to check status)"
            else
              echo "$spec" | jq .
            fi
          done
        done

  export:
    desc: 'Dump every generated SeccompProfile to {{.PROFILE_OUT_DIR}}/<namespace>/<recording-id>.json'
    cmds:
      - |
        set -e
        for ns in {{.NS_FULL}} {{.NS_STRIPPED}}; do
          mkdir -p "{{.PROFILE_OUT_DIR}}/$ns"
          for name in $(kubectl get seccompprofile -l spo.x-k8s.io/recording-namespace="$ns" -o jsonpath='{.items[*].metadata.name}'); do
            # File name is the recording-id label (e.g. "service-a"), not the
            # object's own metadata.name (which carries a random per-pod
            # suffix) — this is what `diff` looks the file up by.
            recording_id=$(kubectl get seccompprofile "$name" -o jsonpath='{.metadata.labels.spo\.x-k8s\.io/recording-id}')
            out="{{.PROFILE_OUT_DIR}}/$ns/${recording_id:-$name}.json"
            kubectl get seccompprofile "$name" -o jsonpath='{.spec}' | jq . > "$out"
            echo "wrote $out"
          done
        done

  diff:
    desc: 'Compare full vs stripped syscall surfaces for service-a and service-b'
    deps: [export]
    cmds:
      - |
        for svc in service-a service-b; do
          full_file="{{.PROFILE_OUT_DIR}}/{{.NS_FULL}}/$svc.json"
          stripped_file="{{.PROFILE_OUT_DIR}}/{{.NS_STRIPPED}}/$svc.json"
          echo ""
          echo "=== $svc: {{.NS_FULL}} vs {{.NS_STRIPPED}} ==="
          if [ ! -f "$full_file" ] || [ ! -f "$stripped_file" ]; then
            echo "  (missing profile for $svc — skipping)"
            continue
          fi
          full_syscalls=$(mktemp)
          stripped_syscalls=$(mktemp)
          jq -r '.syscalls[].names[]' "$full_file" | sort -u > "$full_syscalls"
          jq -r '.syscalls[].names[]' "$stripped_file" | sort -u > "$stripped_syscalls"
          # Differences are the expected, interesting output here, not an
          # error — don't let `diff`'s nonzero exit fail this task.
          diff --unified=0 --label "$svc ({{.NS_FULL}})" --label "$svc ({{.NS_STRIPPED}})" \
            "$full_syscalls" "$stripped_syscalls" || true
          rm -f "$full_syscalls" "$stripped_syscalls"
        done

  clean:
    desc: 'Delete generated SeccompProfile CRDs in both namespaces and remove exported profiles'
    cmds:
      # Cluster-scoped resource — `--all -n` would ignore the namespace and
      # delete everything twice over; scope by label instead.
      - kubectl delete seccompprofile -l spo.x-k8s.io/recording-namespace={{.NS_FULL}} --ignore-not-found
      - kubectl delete seccompprofile -l spo.x-k8s.io/recording-namespace={{.NS_STRIPPED}} --ignore-not-found
      - rm -rf {{.PROFILE_OUT_DIR}}
