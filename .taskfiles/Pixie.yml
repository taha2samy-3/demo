version: '3'

tasks:
  deploy:
    desc: 'Deploy Pixie onto the current KUBECONFIG cluster'
    cmds:
      - px deploy

  status:
    desc: 'Check the status of the Pixie deployment'
    cmds:
      - px status

  undeploy:
    desc: 'Remove Pixie from the current KUBECONFIG cluster'
    cmds:
      - px undeploy
  forward:
    cmds:
      - kubectl port-forward -n pixie-collector svc/pixie-collector 5000:5000 4317:4317
