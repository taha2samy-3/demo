# ProfileRecording manifests for the tls-demo-stripped namespace.
# See recording-full.yaml for the apiVersion/field notes — identical
# shape, just a different target namespace.
---
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: ProfileRecording
metadata:
  name: service-a
  namespace: tls-demo-stripped
spec:
  kind: SeccompProfile
  recorder: Bpf
  podSelector:
    matchLabels:
      app.kubernetes.io/name: service-a
      app.kubernetes.io/part-of: tls-demo
---
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: ProfileRecording
metadata:
  name: service-b
  namespace: tls-demo-stripped
spec:
  kind: SeccompProfile
  recorder: Bpf
  podSelector:
    matchLabels:
      app.kubernetes.io/name: service-b
      app.kubernetes.io/part-of: tls-demo
