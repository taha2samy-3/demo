# ProfileRecording manifests for the tls-demo-full namespace.
#
# apiVersion/spec fields verified against security-profiles-operator v1.1.0
# (api/profilerecording/v1/profilerecording_types.go and
# examples/profilerecording-seccomp-bpf.yaml in that repo) — the CRD
# graduated from v1alpha1 to v1 and `recorder` is the capitalized enum
# value "Bpf", not lowercase "bpf". Re-check both against
# `kubectl explain profilerecording.spec` if this drifts again.
#
# The name of each ProfileRecording becomes the name of the resulting
# SeccompProfile once recording stops (single container per pod here, so
# no mergeStrategy is needed).
---
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: ProfileRecording
metadata:
  name: service-a
  namespace: tls-demo-full
spec:
  kind: SeccompProfile
  recorder: Bpf
  podSelector:
    matchLabels:
      app.kubernetes.io/name: service-a
      app.kubernetes.io/part-of: tls-demo
---
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: ProfileRecording
metadata:
  name: service-b
  namespace: tls-demo-full
spec:
  kind: SeccompProfile
  recorder: Bpf
  podSelector:
    matchLabels:
      app.kubernetes.io/name: service-b
      app.kubernetes.io/part-of: tls-demo
