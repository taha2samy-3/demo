name: Build Multi-Arch Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push images to GHCR?'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-tls-demo:
    name: Build TLS Demo (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [full, stripped]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for ARM emulation on x86_64 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-architecture builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Convert repository name to lowercase (Docker tags require lowercase)
      - name: Set repository image environment
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Target Image: $IMAGE_NAME/tls-demo:${{ matrix.target }}"

      # Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push multi-arch images (amd64 and arm64)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./tls-demo
          file: ./tls-demo/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
          tags: |
            ${{ env.IMAGE_NAME }}/tls-demo:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pixie-mock:
    name: Build & Test Pixie Mock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set repository image environment
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Target Image: $IMAGE_NAME/pixie-mock:latest"

      - name: Test Pixie Mock Local Container Build & Runtime Health
        run: |
          docker build -t pixie-mock:test ./pixie_mock
          docker run -d --name test-pixie-mock -p 5000:5000 -p 4317:4317 -e ENABLE_MOCK_VIZIER=true pixie-mock:test
          sleep 8
          docker logs test-pixie-mock
          curl -f http://localhost:5000/api/data || (docker logs test-pixie-mock && exit 1)
          docker rm -f test-pixie-mock

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Pixie Mock image
        uses: docker/build-push-action@v5
        with:
          context: ./pixie_mock
          file: ./pixie_mock/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
          tags: |
            ${{ env.IMAGE_NAME }}/pixie-mock:latest
            ${{ env.IMAGE_NAME }}/pixie-mock:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max