name: Build Multi-Arch Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push images to GHCR?'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-tls-demo:
    name: Build TLS Demo (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [full, stripped]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for ARM emulation on x86_64 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-architecture builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Convert repository name to lowercase (Docker tags require lowercase)
      - name: Set repository image environment
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Target Image: $IMAGE_NAME/tls-demo:${{ matrix.target }}"

      # Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push multi-arch images (amd64 and arm64)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./tls-demo
          file: ./tls-demo/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
          tags: |
            ${{ env.IMAGE_NAME }}/tls-demo:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pixie-collector:
    name: Build & Test Pixie Collector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set repository image environment
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Target Image: $IMAGE_NAME/pixie-collector:latest"

      - name: Test Pixie Collector Local Container Build & Runtime Health
        run: |
          docker build -t pixie-collector:test ./pixie_collector
          docker run -d --name test-pixie-collector -p 5000:5000 -p 4317:4317 pixie-collector:test

          echo "Waiting for Flask dashboard to become healthy..."
          success=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/data > /dev/null; then
              echo "Flask dashboard is healthy (attempt $i)."
              success=true
              break
            fi
            echo "Attempt $i/30: not ready yet, retrying in 3s..."
            sleep 3
          done

          if [ "$success" != "true" ]; then
            echo "Flask dashboard did not become healthy in time."
            docker logs test-pixie-collector
            docker rm -f test-pixie-collector
            exit 1
          fi

          echo "Checking OTLP gRPC receiver is accepting connections on port 4317..."
          if ! nc -z localhost 4317; then
            echo "gRPC receiver is not accepting connections on port 4317."
            docker logs test-pixie-collector
            docker rm -f test-pixie-collector
            exit 1
          fi
          echo "gRPC receiver is accepting connections."

          docker logs test-pixie-collector
          docker rm -f test-pixie-collector

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Pixie Collector image
        uses: docker/build-push-action@v5
        with:
          context: ./pixie_collector
          file: ./pixie_collector/Dockerfile
          # amd64 only: spaCy + the transformer pipeline under QEMU arm64 emulation is slow and failure-prone.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
          tags: |
            ${{ env.IMAGE_NAME }}/pixie-collector:latest
            ${{ env.IMAGE_NAME }}/pixie-collector:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max