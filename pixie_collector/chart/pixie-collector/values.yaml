image:
  repository: ghcr.io/taha2samy-3/demo/pixie-collector
  tag: latest
  pullPolicy: Always

replicaCount: 1

ports:
  grpc: 4317
  http: 5000

resources:
  # CONFIRMED OOMKilled (Exit Code 137) against the previous 3Gi limit —
  # `kubectl describe pod` showed Last State: Terminated, Reason: OOMKilled.
  # That was hit under a startup race (web_app.py's port-check ran before
  # otlp_receiver.py finished binding 4317, so both processes loaded both
  # spaCy models — 2 models x 2 processes). Even once that race is fixed
  # (models load exactly once, in otlp_receiver.py's process only), the
  # DistilBERT transformer pipeline alone pulls in a real PyTorch runtime +
  # model weights, so this is set well above the single-load footprint on
  # purpose, not tuned to the bare minimum.
  # Re-check with `kubectl top pod -n pixie-collector` once the race-
  # condition fix is deployed before ever lowering this — don't guess.
  requests:
    memory: "2Gi"
    cpu: "500m"
  limits:
    memory: "5Gi"
    cpu: "1500m"

service:
  type: ClusterIP

# Startup is slow for the same double-load reason above. Generous on
# purpose — tune down once the duplicate model loading is fixed.
startupProbe:
  failureThreshold: 40
  periodSeconds: 10 # up to ~6.5 minutes to become ready

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is intentionally left off: app/state.py writes
# logs_data.json next to the source files inside the image
# (os.path.dirname(__file__)), so a read-only root FS breaks persistence as
# the code stands today. Tighten this once DATA_FILE is made configurable
# and pointed at a mounted volume.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL