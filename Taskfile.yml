version: '3'

dotenv: ['.env']

env:
  KUBECONFIG: '{{.KUBECONFIG | default "./kubeconfig.yaml"}}'

includes:
  infra: ./.taskfiles/Infra.yml
  pixie: ./.taskfiles/Pixie.yml
  helm: ./.taskfiles/Helm.yml
  seccomp: ./.taskfiles/Seccomp.yml

tasks:
  default:
    cmds:
      - task --list
    silent: true

  deploy-all:
    desc: 'Bring up infra, then deploy Pixie, then install all Helm releases (sequential — infra must be ready first)'
    cmds:
      - task: infra:up
      - task: seccomp:install-operator
      - 
      - task: pixie:deploy
      - task: helm:install-all
  deploy-pixie:
    cmds: 
      - task: pixie:deploy
      
