image:
  repository: ghcr.io/taha2samy-3/demo/tls-demo
  variant: ""
  pullPolicy: Always

sendIntervalSeconds: "5"

# Health-probe TLS handshake noise (kubelet's tcpSocket probe) is filtered
# out of server logs by default. Set to "true" to see it again when
# actually debugging TLS.
logProbeErrors: "false"

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"
  requests:
    memory: "64Mi"
    cpu: "100m"

services:
  - name: service-a
    peer: service-b
  - name: service-b
    peer: service-a

