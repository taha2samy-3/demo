image:
  repository: ghcr.io/taha2samy-3/demo/tls-demo
  variant: ""
  pullPolicy: Always

sendIntervalSeconds: "5"

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"
  requests:
    memory: "64Mi"
    cpu: "100m"

services:
  - name: service-a
    peer: service-b
  - name: service-b
    peer: service-a

