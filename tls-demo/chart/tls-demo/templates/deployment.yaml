{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: tls-demo
    variant: {{ $.Values.image.variant }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: tls-demo
        variant: {{ $.Values.image.variant }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.variant }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SERVICE_NAME
              value: {{ .name }}
            - name: PEER_ADDR
              value: "{{ .peer }}:8443"
            - name: LISTEN_ADDR
              value: ":8443"
            - name: SEND_INTERVAL_SECONDS
              value: {{ $.Values.sendIntervalSeconds | quote }}
          ports:
            - containerPort: 8443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
{{- end }}
