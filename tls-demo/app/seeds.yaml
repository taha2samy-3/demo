templates:
  - kind: "health_check"
    request: |
      {"id":"{{.ID}}","kind":"health_check"}
    response: |
      {"status":"ok","msg":"healthy","uptime_s":8213}

  - kind: "metrics_report"
    request: |
      {"id":"{{.ID}}","kind":"metrics_report","cpu_pct":42,"mem_pct":67,"queue_depth":3}
    response: |
      {"status":"ok","msg":"metrics accepted"}

  - kind: "product_search"
    request: |
      {"id":"{{.ID}}","kind":"product_search","query":"{{.Product}}"}
    response: |
      {"status":"ok","results":["{{.Product}}"],"count":1}

  - kind: "user_registration"
    request: |
      {"id":"{{.ID}}","kind":"user_registration","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}","phone":"{{.Phone}}"}
    response: |
      {"status":"ok","msg":"Welcome {{.FirstName}}, your account {{.Email}} has been created."}

  - kind: "b2b_contact"
    request: |
      {"id":"{{.ID}}","kind":"b2b_contact","name":"{{.FirstName}} {{.LastName}}","company":"{{.Company}}","title":"{{.JobTitle}}","email":"{{.Email}}","phone":"{{.Phone}}"}
    response: |
      {"status":"ok","msg":"Contact saved for {{.Company}}"}

  - kind: "checkout_payment"
    request: |
      {"id":"{{.ID}}","kind":"checkout_payment","name":"{{.FirstName}} {{.LastName}}","card_number":"{{.CardNumber}}","billing_address":"{{.Street}}, {{.City}}","order_id":"{{.OrderID}}"}
    response: |
      {"status":"ok","msg":"Payment authorized","order_id":"{{.OrderID}}","confirmation":"CNF-{{.ID}}"}

  - kind: "identity_verification"
    request: |
      {"id":"{{.ID}}","kind":"identity_verification","name":"{{.FirstName}} {{.LastName}}","ssn":"{{.SSN}}","address":"{{.Street}}, {{.City}}"}
    response: |
      {"status":"ok","msg":"Identity verified for {{.FirstName}} {{.LastName}}"}

  - kind: "medical_record"
    request: |
      {"id":"{{.ID}}","kind":"medical_record","patient_name":"{{.FirstName}} {{.LastName}}","diagnosis":"{{.Diagnosis}}","medication":"{{.Medication}}","clinic":"{{.Company}}"}
    response: |
      {"status":"ok","msg":"Record filed for patient {{.FirstName}} {{.LastName}}"}

  - kind: "support_ticket"
    request: |
      {"id":"{{.ID}}","kind":"support_ticket","ticket_id":"{{.TicketID}}","name":"{{.FirstName}} {{.LastName}}","phone":"{{.Phone}}","city":"{{.City}}","issue":"Cannot access account for order {{.OrderID}}"}
    response: |
      {"status":"ok","msg":"Ticket {{.TicketID}} opened for {{.FirstName}}"}

  - kind: "shipping_update"
    request: |
      {"id":"{{.ID}}","kind":"shipping_update","order_id":"{{.OrderID}}","recipient":"{{.FirstName}} {{.LastName}}","address":"{{.Street}}, {{.City}}"}
    response: |
      {"status":"ok","msg":"Order {{.OrderID}} shipped to {{.City}}"}

  - kind: "job_application"
    request: |
      {"id":"{{.ID}}","kind":"job_application","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}","phone":"{{.Phone}}","applying_for":"{{.JobTitle}}","company":"{{.Company}}"}
    response: |
      {"status":"ok","msg":"Application received for {{.JobTitle}} at {{.Company}}"}
