templates:
  - kind: "health_check"
    request: |
      {"id":"{{.ID}}","kind":"health_check"}
    response: |
      {"status":"ok","msg":"healthy","uptime_s":8213}

  - kind: "metrics_report"
    request: |
      {"id":"{{.ID}}","kind":"metrics_report","cpu_pct":42,"mem_pct":67,"queue_depth":3}
    response: |
      {"status":"ok","msg":"metrics accepted"}

  - kind: "product_search"
    request: |
      {"id":"{{.ID}}","kind":"product_search","query":"{{.Product}}"}
    response: |
      {"status":"ok","results":["{{.Product}}"],"count":1}

  - kind: "user_registration"
    request: |
      {"id":"{{.ID}}","kind":"user_registration","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}","phone":"{{.Phone}}"}
    response: |
      {"status":"ok","msg":"Welcome {{.FirstName}}, your account {{.Email}} has been created."}

  - kind: "b2b_contact"
    request: |
      {"id":"{{.ID}}","kind":"b2b_contact","name":"{{.FirstName}} {{.LastName}}","company":"{{.Company}}","title":"{{.JobTitle}}","email":"{{.Email}}","phone":"{{.Phone}}"}
    response: |
      {"status":"ok","msg":"Contact saved for {{.Company}}"}

  - kind: "checkout_payment"
    request: |
      {"id":"{{.ID}}","kind":"checkout_payment","name":"{{.FirstName}} {{.LastName}}","card_number":"{{.CardNumber}}","billing_address":"{{.Street}}, {{.City}}","order_id":"{{.OrderID}}"}
    response: |
      {"status":"ok","msg":"Payment authorized","order_id":"{{.OrderID}}","confirmation":"CNF-{{.ID}}"}

  - kind: "identity_verification"
    request: |
      {"id":"{{.ID}}","kind":"identity_verification","name":"{{.FirstName}} {{.LastName}}","ssn":"{{.SSN}}","address":"{{.Street}}, {{.City}}"}
    response: |
      {"status":"ok","msg":"Identity verified for {{.FirstName}} {{.LastName}}"}

  - kind: "medical_record"
    request: |
      {"id":"{{.ID}}","kind":"medical_record","patient_name":"{{.FirstName}} {{.LastName}}","diagnosis":"{{.Diagnosis}}","medication":"{{.Medication}}","clinic":"{{.Company}}"}
    response: |
      {"status":"ok","msg":"Record filed for patient {{.FirstName}} {{.LastName}}"}

  - kind: "support_ticket"
    request: |
      {"id":"{{.ID}}","kind":"support_ticket","ticket_id":"{{.TicketID}}","name":"{{.FirstName}} {{.LastName}}","phone":"{{.Phone}}","city":"{{.City}}","issue":"Cannot access account for order {{.OrderID}}"}
    response: |
      {"status":"ok","msg":"Ticket {{.TicketID}} opened for {{.FirstName}}"}

  - kind: "shipping_update"
    request: |
      {"id":"{{.ID}}","kind":"shipping_update","order_id":"{{.OrderID}}","recipient":"{{.FirstName}} {{.LastName}}","address":"{{.Street}}, {{.City}}"}
    response: |
      {"status":"ok","msg":"Order {{.OrderID}} shipped to {{.City}}"}

  - kind: "job_application"
    request: |
      {"id":"{{.ID}}","kind":"job_application","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}","phone":"{{.Phone}}","applying_for":"{{.JobTitle}}","company":"{{.Company}}"}
    response: |
      {"status":"ok","msg":"Application received for {{.JobTitle}} at {{.Company}}"}

  - kind: "newsletter_signup"
    request: |
      {"id":"{{.ID}}","kind":"newsletter_signup","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}"}
    response: |
      {"status":"ok","msg":"Thanks for subscribing, {{.FirstName}}! Confirmation sent to {{.Email}}."}

  - kind: "password_reset"
    request: |
      {"id":"{{.ID}}","kind":"password_reset","email":"{{.Email}}","device":"{{.DeviceType}}","ip":"{{.IP}}"}
    response: |
      {"status":"ok","msg":"Password reset link sent to {{.Email}}"}

  - kind: "insurance_claim"
    request: |
      {"id":"{{.ID}}","kind":"insurance_claim","name":"{{.FirstName}} {{.LastName}}","policy_number":"{{.PolicyNumber}}","diagnosis":"{{.Diagnosis}}"}
    response: |
      {"status":"ok","msg":"Claim received","claim_reference":"CLM-{{.ID}}"}

  - kind: "loan_application"
    request: |
      {"id":"{{.ID}}","kind":"loan_application","name":"{{.FirstName}} {{.LastName}}","employer":"{{.Company}}","loan_amount":"{{.LoanAmount}}","bank_name":"{{.BankName}}","iban":"{{.IBAN}}"}
    response: |
      {"status":"ok","msg":"Application under review","application_id":"LN-{{.ID}}"}

  - kind: "appointment_booking"
    request: |
      {"id":"{{.ID}}","kind":"appointment_booking","name":"{{.FirstName}} {{.LastName}}","phone":"{{.Phone}}","appointment_type":"{{.AppointmentType}}","city":"{{.City}}","student_id":"{{.StudentID}}","school":"{{.School}}"}
    response: |
      {"status":"ok","msg":"Appointment confirmed for {{.FirstName}} at {{.City}}"}

  - kind: "feedback_survey"
    request: |
      {"id":"{{.ID}}","kind":"feedback_survey","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}","product":"{{.Product}}","comment":"Really happy with the {{.Product}}, would recommend it."}
    response: |
      {"status":"ok","msg":"Thanks for the feedback, {{.FirstName}}!"}

  - kind: "refund_request"
    request: |
      {"id":"{{.ID}}","kind":"refund_request","name":"{{.FirstName}} {{.LastName}}","order_id":"{{.OrderID}}","card_number":"{{.CardNumber}}"}
    response: |
      {"status":"ok","msg":"Refund initiated for order {{.OrderID}}"}

  - kind: "login_alert"
    request: |
      {"id":"{{.ID}}","kind":"login_alert","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}","ip":"{{.IP}}","device":"{{.DeviceType}}"}
    response: |
      {"status":"ok","msg":"New sign-in detected for {{.Email}} from {{.DeviceType}}. If this wasn't you, secure your account."}

  - kind: "employee_onboarding"
    request: |
      {"id":"{{.ID}}","kind":"employee_onboarding","name":"{{.FirstName}} {{.LastName}}","employee_id":"{{.EmployeeID}}","company":"{{.Company}}","job_title":"{{.JobTitle}}"}
    response: |
      {"status":"ok","msg":"Welcome to {{.Company}}, {{.FirstName}}! Your employee ID is {{.EmployeeID}}."}

  - kind: "subscription_change"
    request: |
      {"id":"{{.ID}}","kind":"subscription_change","name":"{{.FirstName}} {{.LastName}}","email":"{{.Email}}","subscription_plan":"{{.SubscriptionPlan}}"}
    response: |
      {"status":"ok","msg":"Your plan has been changed to {{.SubscriptionPlan}}"}
